# 注册后的令牌只写入服务器私有配置，不提交仓库。
concurrent = 6
check_interval = 3

[[runners]]
  name = "mskdsp-lower-docker"
  url = "http://192.168.10.198:8929"
  token = "REPLACE_ON_SERVER"
  executor = "docker"
  limit = 6
  request_concurrency = 6
  [runners.docker]
    image = "mskdsp-ci-tools:ubuntu24.04-x64"
    privileged = false
    cpus = "8"
    memory = "16g"
    shm_size = 268435456
    volumes = ["/home/daniel/gitlab-runner-lower-cache:/cache"]
    pull_policy = ["if-not-present"]
    allowed_pull_policies = ["always", "if-not-present"]
    helper_image = "docker.m.daocloud.io/gitlab/gitlab-runner-helper@sha256:13188cca15a2d44fc621d42da4efb42b81c9527e072d07aab29468dea15af831"
