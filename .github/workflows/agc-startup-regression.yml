name: AGC 启动竞态红绿验证

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: 旧实现复现与修复后完整回归
    uses: ./.github/workflows/build-lower.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04
      arch_slug: x64
      platform: linux-x64
      package_arch: x86-64
      docker_from_platform: linux/amd64
      docker_base_image: amd64/ubuntu:noble
      vcpkg_triplet: x64-linux-dynamic
      triplet_file: cmake/vcpkg-triplets/x64-linux-dynamic.cmake
      strip_debug: false
      channel: ci
      r2_prefix: mskdsp-lower-x64/ci
      static_update_base_url: ${{ format('{0}/mskdsp-lower-x64', vars.R2_PUBLIC_BASE_URL || 'https://update.clsclear.top') }}
      verify_legacy_startup: true
