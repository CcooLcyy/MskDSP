name: 持续集成

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - beta/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 两个架构各自调用同一个可复用工作流（.github/workflows/build-lower.yml），
  # 刻意不声明 needs：GitHub Actions 的 job 默认并发调度，两者分别落在
  # ubuntu-24.04-arm 与 ubuntu-24.04 两个 runner 池上，总耗时取较大值，
  # 不会回到"x64 串在 arm64 前面"的旧形态。
  #
  # arm64：现场交付链路，发布到 mskdsp-lower/ci，剥离调试信息并产出独立符号包。
  arm64-package:
    name: ARM64 编译与单测（主分支产出安装包）
    uses: ./.github/workflows/build-lower.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04-arm
      arch_slug: arm64
      platform: linux-arm64
      package_arch: aarch64
      docker_from_platform: linux/arm64
      docker_base_image: arm64v8/ubuntu:noble
      vcpkg_triplet: arm64-linux-dynamic
      triplet_file: cmake/vcpkg-triplets/arm64-linux-dynamic.cmake
      strip_debug: true
      channel: ci
      r2_prefix: mskdsp-lower/ci
      static_update_base_url: ${{ format('{0}/mskdsp-lower', vars.R2_PUBLIC_BASE_URL || 'https://pub-19f3d71852b04011b120b1b814141c12.r2.dev') }}

  # x64：无现场设备时的服务器验证链路（在 x86_64 服务器上跑起下位机模拟现场），
  # 发布到独立前缀 mskdsp-lower-x64/ci，避免与 arm64 的 latest.json 互相覆盖；
  # 保留完整调试信息，便于直接定位问题。
  x64-package:
    name: x64 编译与单测（主分支产出安装包）
    uses: ./.github/workflows/build-lower.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04
      arch_slug: x64
      platform: linux-x64
      package_arch: x86-64
      docker_from_platform: linux/amd64
      docker_base_image: amd64/ubuntu:noble
      vcpkg_triplet: x64-linux-dynamic
      triplet_file: cmake/vcpkg-triplets/x64-linux-dynamic.cmake
      strip_debug: false
      channel: ci
      r2_prefix: mskdsp-lower-x64/ci
      static_update_base_url: ${{ format('{0}/mskdsp-lower-x64', vars.R2_PUBLIC_BASE_URL || 'https://pub-19f3d71852b04011b120b1b814141c12.r2.dev') }}
