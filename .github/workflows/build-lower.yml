name: 下位机架构构建（可复用）

# 可复用工作流：按传入架构完成
#   编译 → 单元测试 → 装包 → IEC61850 交付包校验 → docker 镜像 → 自解压安装包
#   → 校验文件 → 更新清单 → artifact 上传 → R2 渠道发布
#
# 调用方（如 ci.yml）为每个架构各调用一次；调用方不声明 needs 时，
# GitHub Actions 会把这些 job 并发调度到各自的 runner 池上。
#
# 缓存键刻意与抽取前保持完全一致（vcpkg 二进制缓存 / ccache），
# 以保证重构不会让已有缓存失效。

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub 托管 runner 标签（ubuntu-24.04-arm / ubuntu-24.04）
        required: true
        type: string
      arch_slug:
        description: 架构短名，用于构建目录、产物名与缓存键（arm64 / x64）
        required: true
        type: string
      platform:
        description: 更新清单中的平台标识（linux-arm64 / linux-x64）
        required: true
        type: string
      package_arch:
        description: check_iec61850_package.sh 的架构参数（aarch64 / x86-64）
        required: true
        type: string
      docker_from_platform:
        description: Dockerfile 基础镜像的 --platform 值（linux/arm64 / linux/amd64）
        required: true
        type: string
      docker_base_image:
        description: Dockerfile 基础镜像名（arm64v8/ubuntu:noble / amd64/ubuntu:noble）
        required: true
        type: string
      vcpkg_triplet:
        description: vcpkg triplet（arm64-linux-dynamic / x64-linux-dynamic）
        required: true
        type: string
      triplet_file:
        description: 对应的 vcpkg overlay triplet 文件路径，用于计算缓存键
        required: true
        type: string
      strip_debug:
        description: 是否剥离调试信息并产出独立调试符号包
        required: true
        type: boolean
      r2_prefix:
        description: R2 发布前缀（如 mskdsp-lower/ci、mskdsp-lower-x64/ci）
        required: true
        type: string
      static_update_base_url:
        description: 更新清单中资产 URL 的基地址
        required: true
        type: string
      channel:
        description: 更新清单与产物名中的渠道名
        required: false
        default: ci
        type: string
    secrets:
      R2_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      MSKDSP_PROTO_SSH_KEY:
        required: false
      MSKDSP_PROTO_TOKEN:
        required: false

env:
  R2_BUCKET: ${{ vars.R2_BUCKET || 'mskdsp-update' }}
  R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://pub-19f3d71852b04011b120b1b814141c12.r2.dev' }}

jobs:
  build:
    name: 构建与出包
    runs-on: ${{ inputs.runner }}
    env:
      VCPKG_BINARY_CACHE_DIR: ${{ github.workspace }}/.cache/vcpkg/${{ inputs.vcpkg_triplet }}-release
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/cmake/vcpkg-triplets
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache/${{ inputs.vcpkg_triplet }}
      STATIC_UPDATE_BASE_URL: ${{ inputs.static_update_base_url }}
      BUILD_DIR: build-${{ inputs.arch_slug }}
    steps:
      - name: 拉取主仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: 恢复 vcpkg 二进制缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE_DIR }}
          key: vcpkg-bin-${{ runner.os }}-gcc14-${{ inputs.vcpkg_triplet }}-release-mainline-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', inputs.triplet_file) }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-gcc14-${{ inputs.vcpkg_triplet }}-release-mainline-
            vcpkg-bin-${{ runner.os }}-gcc14-${{ inputs.vcpkg_triplet }}-release-

      - name: 恢复 ccache 编译缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-gcc14-${{ inputs.vcpkg_triplet }}-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-gcc14-${{ inputs.vcpkg_triplet }}-v2-

      - name: 准备 vcpkg 二进制缓存环境
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${VCPKG_BINARY_CACHE_DIR}"
          mkdir -p "${CCACHE_DIR}"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${VCPKG_BINARY_CACHE_DIR}" >> "${GITHUB_ENV}"
          echo "VCPKG_BINARY_SOURCES=clear;files,${VCPKG_BINARY_CACHE_DIR},readwrite" >> "${GITHUB_ENV}"
          echo "CCACHE_DIR=${CCACHE_DIR}" >> "${GITHUB_ENV}"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "CCACHE_COMPILERCHECK=content" >> "${GITHUB_ENV}"
          echo "CCACHE_MAXSIZE=1G" >> "${GITHUB_ENV}"

      - name: 生成构建元数据
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(tr -d '\n' < VERSION)"
          BUILD_DATE="$(TZ=Asia/Shanghai date +%Y%m%d)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          BRANCH_SUFFIX="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          CHANNEL="${{ inputs.channel }}"
          PLATFORM="${{ inputs.platform }}"
          IMAGE_VERSION="${BASE_VERSION}-${BRANCH_SUFFIX}-${CHANNEL}-${BUILD_DATE}-${SHORT_SHA}-${PLATFORM}"
          ARCHIVE_NAME="mskdsp-${IMAGE_VERSION}"
          DEBUG_ARCHIVE_NAME="mskdsp-${BASE_VERSION}-${BRANCH_SUFFIX}-${CHANNEL}-${BUILD_DATE}-${SHORT_SHA}-debugsymbols-${PLATFORM}"
          echo "image_version=${IMAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "archive_name=${ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "debug_archive_name=${DEBUG_ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: 准备 protobuf 子模块访问
        shell: bash
        env:
          MSKDSP_PROTO_SSH_KEY: ${{ secrets.MSKDSP_PROTO_SSH_KEY }}
          MSKDSP_PROTO_TOKEN: ${{ secrets.MSKDSP_PROTO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${MSKDSP_PROTO_SSH_KEY:-}" ]; then
            install -m 700 -d "${HOME}/.ssh"
            printf '%s\n' "${MSKDSP_PROTO_SSH_KEY}" > "${HOME}/.ssh/id_ed25519"
            chmod 600 "${HOME}/.ssh/id_ed25519"
            ssh-keyscan github.com >> "${HOME}/.ssh/known_hosts"
            echo "已启用 SSH key 访问 protobuf 子模块"
          elif [ -n "${MSKDSP_PROTO_TOKEN:-}" ]; then
            git config --global url."https://${MSKDSP_PROTO_TOKEN}@github.com/".insteadOf "git@github.com:"
            echo "已启用 Token 访问 protobuf 子模块"
          else
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            echo "未配置子模块凭据，已切换为 HTTPS 拉取 protobuf 子模块"
          fi

      - name: 拉取 protobuf 子模块
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 安装构建依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            gcc-14 \
            g++-14 \
            curl \
            unzip

      - name: 安装 vcpkg
        shell: bash
        run: |
          set -euo pipefail
          VCPKG_ROOT="${RUNNER_TEMP}/vcpkg"
          VCPKG_BASELINE="$(python3 - <<'PY'
          import json
          with open('vcpkg-configuration.json', 'r', encoding='utf-8') as fh:
              print(json.load(fh)['default-registry']['baseline'])
          PY
          )"
          git clone https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
          git -C "${VCPKG_ROOT}" checkout "${VCPKG_BASELINE}"
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=${VCPKG_ROOT}" >> "${GITHUB_ENV}"

      - name: 配置 ${{ inputs.arch_slug }} RelWithDebInfo
        shell: bash
        run: |
          set -euo pipefail
          # strip_debug=true 时剥离调试信息并在后续产出独立符号包；
          # strip_debug=false 时保留完整调试信息，便于直接在服务器上定位问题。
          STRIP_FLAG=""
          if [ "${{ inputs.strip_debug }}" = "true" ]; then
            STRIP_FLAG="-DMSKDSP_STRIP_DEBUG=ON"
          fi
          TRIPLET="${{ inputs.vcpkg_triplet }}"
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DMSKDSP_BUILD_TESTS=ON \
            ${STRIP_FLAG} \
            -DVCPKG_HOST_TRIPLET="${TRIPLET}" \
            -DVCPKG_TARGET_TRIPLET="${TRIPLET}" \
            -DProtobuf_PROTOC_EXECUTABLE="${GITHUB_WORKSPACE}/${BUILD_DIR}/vcpkg_installed/${TRIPLET}/tools/protobuf/protoc" \
            -DgRPC_CPP_PLUGIN_EXECUTABLE="${GITHUB_WORKSPACE}/${BUILD_DIR}/vcpkg_installed/${TRIPLET}/tools/grpc/grpc_cpp_plugin"

      - name: 清零 ccache 统计
        shell: bash
        run: |
          set -euo pipefail
          ccache --zero-stats

      - name: 编译 ${{ inputs.arch_slug }} RelWithDebInfo
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "${BUILD_DIR}" --parallel

      - name: 运行 ${{ inputs.arch_slug }} 单元测试
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "${BUILD_DIR}" --output-on-failure --parallel "$(nproc)"

      - name: 输出 ccache 统计
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          else
            echo "ccache 不可用，跳过统计输出"
          fi

      - name: 安装运行产物到 package
        if: ${{ github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main') }}
        shell: bash
        run: |
          set -euo pipefail
          cmake --install "${BUILD_DIR}"
          find package -maxdepth 1 -type f -name '*_test' -delete

      - name: 检查 ${{ inputs.arch_slug }} IEC61850 交付包
        if: ${{ github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main') }}
        shell: bash
        run: |
          set -euo pipefail
          bash script/check_iec61850_package.sh package ${{ inputs.package_arch }} false true

      - name: 打包调试符号
        if: ${{ github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main') }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d package/debug ]; then
            tar -C package -czf "${{ steps.meta.outputs.debug_archive_name }}.tar.gz" debug
          fi

      - name: 准备 Docker Buildx
        if: ${{ github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main') }}
        uses: docker/setup-buildx-action@v3

      - name: 生成自解压测试包
        if: ${{ github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main') }}
        id: lower_image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          CI_DOCKERFILE="${RUNNER_TEMP}/Dockerfile.ci-${{ inputs.arch_slug }}"
          sed -e 's#--platform=linux/arm64#--platform=${{ inputs.docker_from_platform }}#' \
              -e 's#localhost/arm64v8/ubuntu:noble#${{ inputs.docker_base_image }}#' Dockerfile > "${CI_DOCKERFILE}"
          IMAGE_REF="mskdsp:${{ steps.meta.outputs.image_version }}"
          IMAGE_TAR="images/${{ steps.meta.outputs.archive_name }}.tar"
          docker buildx build \
            --platform ${{ inputs.docker_from_platform }} \
            --load \
            -t "${IMAGE_REF}" \
            -f "${CI_DOCKERFILE}" \
            .
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${IMAGE_REF}")"
          echo "image_id=${IMAGE_ID}" >> "${GITHUB_OUTPUT}"
          rm -f "${IMAGE_TAR}"
          docker save -o "${IMAGE_TAR}" "${IMAGE_REF}"
          (
            cd script
            bash ./make_exe.sh "../${IMAGE_TAR}"
          )
          rm -f "${IMAGE_TAR}"

      - name: 生成校验文件
        if: ${{ github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main') }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=("images/${{ steps.meta.outputs.archive_name }}")
          if [ -f "${{ steps.meta.outputs.debug_archive_name }}.tar.gz" ]; then
            ASSETS+=("${{ steps.meta.outputs.debug_archive_name }}.tar.gz")
          fi
          sha256sum "${ASSETS[@]}" > SHA256SUMS

      - name: 生成静态更新清单
        if: ${{ github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main') }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          python3 script/workflow/write_lower_update_manifest.py \
            --channel "${{ inputs.channel }}" \
            --platform ${{ inputs.platform }} \
            --version "${{ steps.meta.outputs.image_version }}" \
            --image-id "${{ steps.lower_image.outputs.image_id }}" \
            --artifact "images/${{ steps.meta.outputs.archive_name }}" \
            --checksums SHA256SUMS \
            --output latest.json \
            --base-url "${STATIC_UPDATE_BASE_URL}" \
            --repository "${{ github.repository }}" \
            --source-ref "${{ github.ref_name }}" \
            --source-sha "${SOURCE_SHA}"

      - name: 上传 ${{ inputs.arch_slug }} 测试安装包
        if: ${{ github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.archive_name }}
          path: |
            images/${{ steps.meta.outputs.archive_name }}
            ${{ steps.meta.outputs.debug_archive_name }}.tar.gz
            SHA256SUMS
            latest.json
          if-no-files-found: ignore

      - name: 发布 ${{ inputs.arch_slug }} 包到 Cloudflare R2
        if: ${{ github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main') }}
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            AWS_ARCH=""
            case "$(uname -m)" in
              aarch64|arm64) AWS_ARCH="aarch64" ;;
              x86_64|amd64) AWS_ARCH="x86_64" ;;
              *) echo "不支持的 Runner 架构: $(uname -m)" >&2; exit 1 ;;
            esac
            AWS_TMP_DIR="$(mktemp -d "${RUNNER_TEMP}/awscli.XXXXXX")"
            curl -fsSL --retry 3 "https://awscli.amazonaws.com/awscli-exe-linux-${AWS_ARCH}.zip" -o "${AWS_TMP_DIR}/awscliv2.zip"
            unzip -q "${AWS_TMP_DIR}/awscliv2.zip" -d "${AWS_TMP_DIR}"
            sudo "${AWS_TMP_DIR}/aws/install" --update
          fi
          aws --version
          DEBUG_FILE=""
          if [[ -f "${{ steps.meta.outputs.debug_archive_name }}.tar.gz" ]]; then
            DEBUG_FILE="${{ steps.meta.outputs.debug_archive_name }}.tar.gz"
          fi
          R2_ARGS=( \
            --endpoint "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --bucket "${R2_BUCKET}" \
            --prefix "${{ inputs.r2_prefix }}" \
            --public-base-url "${R2_PUBLIC_BASE_URL}" \
            --platform ${{ inputs.platform }} \
            --package-file "images/${{ steps.meta.outputs.archive_name }}" \
            --checksum-file SHA256SUMS \
            --manifest-file latest.json \
          )
          if [[ -n "${DEBUG_FILE}" ]]; then R2_ARGS+=(--debug-file "${DEBUG_FILE}"); fi
          bash script/workflow/upload_r2.sh "${R2_ARGS[@]}"
