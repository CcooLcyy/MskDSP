name: Beta 候选构建

on:
  push:
    branches:
      - beta/**
  workflow_dispatch:
    inputs:
      beta_ref:
        description: 要构建的 beta 分支，例如 beta/0.1
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: beta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STATIC_UPDATE_BASE_URL: ${{ vars.LOWER_UPDATE_STATIC_BASE_URL || vars.UPDATE_STATIC_BASE_URL || 'https://update.clsclear.top/mskdsp-lower' }}
  STATIC_UPDATE_SSH_HOST: ${{ vars.LOWER_UPDATE_STATIC_SSH_HOST || vars.UPDATE_STATIC_SSH_HOST }}
  STATIC_UPDATE_SSH_PORT: ${{ vars.LOWER_UPDATE_STATIC_SSH_PORT || vars.UPDATE_STATIC_SSH_PORT || '22' }}
  STATIC_UPDATE_SSH_USER: ${{ vars.LOWER_UPDATE_STATIC_SSH_USER || vars.UPDATE_STATIC_SSH_USER }}
  STATIC_UPDATE_REMOTE_ROOT: ${{ vars.LOWER_UPDATE_STATIC_REMOTE_ROOT || vars.UPDATE_STATIC_REMOTE_ROOT }}

jobs:
  x64-verify:
    name: x64 Debug 校验
    runs-on: ubuntu-24.04
    env:
      VCPKG_BINARY_CACHE_DIR: ${{ github.workspace }}/.cache/vcpkg/x64-linux-dynamic
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache/x64-linux-dynamic
    steps:
      - name: 计算目标分支
        id: ref
        shell: bash
        env:
          INPUT_BETA_REF: ${{ inputs.beta_ref }}
        run: |
          set -euo pipefail
          TARGET_REF="${INPUT_BETA_REF:-}"
          if [ -z "${TARGET_REF}" ]; then
            TARGET_REF="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${TARGET_REF}" =~ ^beta/ ]]; then
            echo "未能解析有效的 beta 分支。当前值: ${TARGET_REF}"
            echo "请在手动触发时提供 beta_ref，或从目标 beta 分支触发该 workflow。"
            exit 1
          fi
          BETA_LINE="${TARGET_REF#beta/}"
          CACHE_SCOPE="beta-$(printf '%s' "${BETA_LINE}" | tr '/' '-')"
          echo "target_ref=${TARGET_REF}" >> "${GITHUB_OUTPUT}"
          echo "cache_scope=${CACHE_SCOPE}" >> "${GITHUB_OUTPUT}"
          echo "已解析 Beta 版本线缓存作用域: ${CACHE_SCOPE}"

      - name: 拉取主仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.target_ref }}
          fetch-depth: 0
          submodules: false

      - name: 恢复 vcpkg 二进制缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE_DIR }}
          key: vcpkg-bin-${{ runner.os }}-gcc14-x64-linux-dynamic-${{ steps.ref.outputs.cache_scope }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-gcc14-x64-linux-dynamic-${{ steps.ref.outputs.cache_scope }}-
            vcpkg-bin-${{ runner.os }}-gcc14-x64-linux-dynamic-mainline-
            vcpkg-bin-${{ runner.os }}-gcc14-x64-linux-dynamic-

      - name: 恢复 ccache 编译缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-gcc14-x64-linux-dynamic-v1-${{ hashFiles('CMakeLists.txt', 'protobuf/CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ccache-${{ runner.os }}-gcc14-x64-linux-dynamic-v1-

      - name: 准备 vcpkg 二进制缓存环境
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${VCPKG_BINARY_CACHE_DIR}"
          mkdir -p "${CCACHE_DIR}"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${VCPKG_BINARY_CACHE_DIR}" >> "${GITHUB_ENV}"
          echo "VCPKG_BINARY_SOURCES=clear;files,${VCPKG_BINARY_CACHE_DIR},readwrite" >> "${GITHUB_ENV}"
          echo "CCACHE_DIR=${CCACHE_DIR}" >> "${GITHUB_ENV}"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "CCACHE_COMPILERCHECK=content" >> "${GITHUB_ENV}"
          echo "CCACHE_MAXSIZE=1G" >> "${GITHUB_ENV}"

      - name: 准备 protobuf 子模块访问
        shell: bash
        env:
          MSKDSP_PROTO_SSH_KEY: ${{ secrets.MSKDSP_PROTO_SSH_KEY }}
          MSKDSP_PROTO_TOKEN: ${{ secrets.MSKDSP_PROTO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${MSKDSP_PROTO_SSH_KEY:-}" ]; then
            install -m 700 -d "${HOME}/.ssh"
            printf '%s\n' "${MSKDSP_PROTO_SSH_KEY}" > "${HOME}/.ssh/id_ed25519"
            chmod 600 "${HOME}/.ssh/id_ed25519"
            ssh-keyscan github.com >> "${HOME}/.ssh/known_hosts"
            echo "已启用 SSH key 访问 protobuf 子模块"
          elif [ -n "${MSKDSP_PROTO_TOKEN:-}" ]; then
            git config --global url."https://${MSKDSP_PROTO_TOKEN}@github.com/".insteadOf "git@github.com:"
            echo "已启用 Token 访问 protobuf 子模块"
          else
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            echo "未配置子模块凭据，已切换为 HTTPS 拉取 protobuf 子模块"
          fi

      - name: 拉取 protobuf 子模块
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 安装构建依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-14 \
            g++-14 \
            ccache \
            gcovr
          if ! command -v ccache >/dev/null 2>&1; then
            echo "未找到 ccache，可执行文件缺失" >&2
            exit 1
          fi
          ccache --version

      - name: 安装 vcpkg
        shell: bash
        run: |
          set -euo pipefail
          VCPKG_ROOT="${RUNNER_TEMP}/vcpkg"
          VCPKG_BASELINE="$(python3 - <<'PY'
          import json
          with open('vcpkg-configuration.json', 'r', encoding='utf-8') as fh:
              print(json.load(fh)['default-registry']['baseline'])
          PY
          )"
          git clone https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
          git -C "${VCPKG_ROOT}" checkout "${VCPKG_BASELINE}"
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=${VCPKG_ROOT}" >> "${GITHUB_ENV}"

      - name: 配置 x64 Debug
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-dynamic \
            -DMSKDSP_BUILD_TESTS=ON \
            -DMSKDSP_ENABLE_SANITIZERS=OFF \
            -DMSKDSP_ENABLE_TSAN=OFF \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DGCOV_EXECUTABLE=/usr/bin/gcov-14

      - name: 清零 ccache 统计
        shell: bash
        run: |
          set -euo pipefail
          ccache --zero-stats

      - name: 编译 x64 Debug
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel

      - name: 输出 ccache 统计
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats || echo "ccache 统计输出失败，跳过收尾统计"
          else
            echo "ccache 不可用，跳过统计输出"
          fi

      - name: 运行单元测试
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure --parallel "$(nproc)"

  arm64-package:
    name: 产出 arm64 Beta 包
    runs-on: ubuntu-24.04
    needs:
      - x64-verify
    env:
      VCPKG_HOST_BINARY_CACHE_DIR: ${{ github.workspace }}/.cache/vcpkg/x64-linux-dynamic
      VCPKG_BINARY_CACHE_DIR: ${{ github.workspace }}/.cache/vcpkg/arm64-linux-dynamic
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache/arm64-linux-dynamic
    steps:
      - name: 计算目标分支
        id: ref
        shell: bash
        env:
          INPUT_BETA_REF: ${{ inputs.beta_ref }}
        run: |
          set -euo pipefail
          TARGET_REF="${INPUT_BETA_REF:-}"
          if [ -z "${TARGET_REF}" ]; then
            TARGET_REF="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${TARGET_REF}" =~ ^beta/ ]]; then
            echo "未能解析有效的 beta 分支。当前值: ${TARGET_REF}"
            echo "请在手动触发时提供 beta_ref，或从目标 beta 分支触发该 workflow。"
            exit 1
          fi
          BETA_LINE="${TARGET_REF#beta/}"
          CACHE_SCOPE="beta-$(printf '%s' "${BETA_LINE}" | tr '/' '-')"
          echo "target_ref=${TARGET_REF}" >> "${GITHUB_OUTPUT}"
          echo "cache_scope=${CACHE_SCOPE}" >> "${GITHUB_OUTPUT}"
          echo "已解析 Beta 版本线缓存作用域: ${CACHE_SCOPE}"

      - name: 拉取主仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.target_ref }}
          fetch-depth: 0
          submodules: false

      - name: 恢复 vcpkg 二进制缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE_DIR }}
          key: vcpkg-bin-${{ runner.os }}-gcc14-arm64-linux-dynamic-${{ steps.ref.outputs.cache_scope }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-gcc14-arm64-linux-dynamic-${{ steps.ref.outputs.cache_scope }}-
            vcpkg-bin-${{ runner.os }}-gcc14-arm64-linux-dynamic-mainline-
            vcpkg-bin-${{ runner.os }}-gcc14-arm64-linux-dynamic-

      - name: 恢复 vcpkg host 二进制缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_HOST_BINARY_CACHE_DIR }}
          key: vcpkg-bin-${{ runner.os }}-gcc14-x64-linux-dynamic-${{ steps.ref.outputs.cache_scope }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-gcc14-x64-linux-dynamic-${{ steps.ref.outputs.cache_scope }}-
            vcpkg-bin-${{ runner.os }}-gcc14-x64-linux-dynamic-mainline-
            vcpkg-bin-${{ runner.os }}-gcc14-x64-linux-dynamic-

      - name: 恢复 ccache 编译缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-gcc14-arm64-linux-dynamic-v1-${{ hashFiles('CMakeLists.txt', 'protobuf/CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ccache-${{ runner.os }}-gcc14-arm64-linux-dynamic-v1-

      - name: 准备 vcpkg 二进制缓存环境
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${VCPKG_HOST_BINARY_CACHE_DIR}"
          mkdir -p "${VCPKG_BINARY_CACHE_DIR}"
          mkdir -p "${CCACHE_DIR}"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${VCPKG_BINARY_CACHE_DIR}" >> "${GITHUB_ENV}"
          echo "VCPKG_BINARY_SOURCES=clear;files,${VCPKG_HOST_BINARY_CACHE_DIR},read;files,${VCPKG_BINARY_CACHE_DIR},readwrite" >> "${GITHUB_ENV}"
          echo "CCACHE_DIR=${CCACHE_DIR}" >> "${GITHUB_ENV}"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "CCACHE_COMPILERCHECK=content" >> "${GITHUB_ENV}"
          echo "CCACHE_MAXSIZE=1G" >> "${GITHUB_ENV}"

      - name: 生成构建元数据
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(tr -d '\n' < VERSION)"
          BUILD_STAMP="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          TARGET_REF="${{ steps.ref.outputs.target_ref }}"
          BETA_LINE="${TARGET_REF#beta/}"
          BRANCH_SUFFIX="$(echo "${TARGET_REF}" | tr '/' '-')"
          BETA_TAG_PREFIX="beta-${BETA_LINE}-"
          BETA_TAG="${BETA_TAG_PREFIX}${BUILD_STAMP}-${SHORT_SHA}"
          RELEASE_TITLE="Beta ${BETA_LINE} ${BUILD_STAMP}-${SHORT_SHA}"
          NOTES_START_TAG="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
          if [ -n "${NOTES_START_TAG}" ]; then
            echo "已找到 Beta 发布说明基线正式 tag: ${NOTES_START_TAG}"
          else
            echo "未找到可作为 Beta 发布说明基线的正式 tag（匹配 v*），将按首个 Beta 预发布处理"
          fi
          IMAGE_VERSION="${BASE_VERSION}-${BRANCH_SUFFIX}-${BUILD_STAMP}-${SHORT_SHA}-linux-arm64"
          ARCHIVE_NAME="mskdsp-${IMAGE_VERSION}"
          DEBUG_ARCHIVE_NAME="mskdsp-${BASE_VERSION}-${BRANCH_SUFFIX}-${BUILD_STAMP}-${SHORT_SHA}-debugsymbols-linux-arm64"
          echo "beta_line=${BETA_LINE}" >> "${GITHUB_OUTPUT}"
          echo "beta_tag_prefix=${BETA_TAG_PREFIX}" >> "${GITHUB_OUTPUT}"
          echo "beta_tag=${BETA_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"
          echo "notes_start_tag=${NOTES_START_TAG}" >> "${GITHUB_OUTPUT}"
          echo "image_version=${IMAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "archive_name=${ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "debug_archive_name=${DEBUG_ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: 准备 protobuf 子模块访问
        shell: bash
        env:
          MSKDSP_PROTO_SSH_KEY: ${{ secrets.MSKDSP_PROTO_SSH_KEY }}
          MSKDSP_PROTO_TOKEN: ${{ secrets.MSKDSP_PROTO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${MSKDSP_PROTO_SSH_KEY:-}" ]; then
            install -m 700 -d "${HOME}/.ssh"
            printf '%s\n' "${MSKDSP_PROTO_SSH_KEY}" > "${HOME}/.ssh/id_ed25519"
            chmod 600 "${HOME}/.ssh/id_ed25519"
            ssh-keyscan github.com >> "${HOME}/.ssh/known_hosts"
            echo "已启用 SSH key 访问 protobuf 子模块"
          elif [ -n "${MSKDSP_PROTO_TOKEN:-}" ]; then
            git config --global url."https://${MSKDSP_PROTO_TOKEN}@github.com/".insteadOf "git@github.com:"
            echo "已启用 Token 访问 protobuf 子模块"
          else
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            echo "未配置子模块凭据，已切换为 HTTPS 拉取 protobuf 子模块"
          fi

      - name: 拉取 protobuf 子模块
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 安装构建依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-14 \
            g++-14 \
            ccache \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu
          if ! command -v ccache >/dev/null 2>&1; then
            echo "未找到 ccache，可执行文件缺失" >&2
            exit 1
          fi
          ccache --version

      - name: 安装 vcpkg
        shell: bash
        run: |
          set -euo pipefail
          VCPKG_ROOT="${RUNNER_TEMP}/vcpkg"
          VCPKG_BASELINE="$(python3 - <<'PY'
          import json
          with open('vcpkg-configuration.json', 'r', encoding='utf-8') as fh:
              print(json.load(fh)['default-registry']['baseline'])
          PY
          )"
          git clone https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
          git -C "${VCPKG_ROOT}" checkout "${VCPKG_BASELINE}"
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=${VCPKG_ROOT}" >> "${GITHUB_ENV}"

      - name: 配置 arm64 RelWithDebInfo
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DMSKDSP_BUILD_TESTS=OFF \
            -DMSKDSP_STRIP_DEBUG=ON \
            -DCMAKE_STRIP=/usr/bin/aarch64-linux-gnu-strip \
            -DCMAKE_OBJDUMP=/usr/bin/aarch64-linux-gnu-objdump \
            -DCMAKE_OBJCOPY=/usr/bin/aarch64-linux-gnu-objcopy \
            -DVCPKG_HOST_TRIPLET=x64-linux-dynamic \
            -DVCPKG_TARGET_TRIPLET=arm64-linux-dynamic \
            -DProtobuf_PROTOC_EXECUTABLE="${GITHUB_WORKSPACE}/build-arm64/vcpkg_installed/x64-linux-dynamic/tools/protobuf/protoc" \
            -DgRPC_CPP_PLUGIN_EXECUTABLE="${GITHUB_WORKSPACE}/build-arm64/vcpkg_installed/x64-linux-dynamic/tools/grpc/grpc_cpp_plugin"

      - name: 清零 ccache 统计
        shell: bash
        run: |
          set -euo pipefail
          ccache --zero-stats

      - name: 编译 arm64 RelWithDebInfo
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-arm64 --parallel

      - name: 输出 ccache 统计
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats || echo "ccache 统计输出失败，跳过收尾统计"
          else
            echo "ccache 不可用，跳过统计输出"
          fi

      - name: 安装运行产物到 package
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build-arm64

      - name: 打包调试符号
        shell: bash
        run: |
          set -euo pipefail
          if [ -d package/debug ]; then
            tar -C package -czf "${{ steps.meta.outputs.debug_archive_name }}.tar.gz" debug
          fi

      - name: 准备 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 生成自解压 Beta 包
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          CI_DOCKERFILE="${RUNNER_TEMP}/Dockerfile.beta"
          sed 's#localhost/arm64v8/ubuntu:noble#arm64v8/ubuntu:noble#' Dockerfile > "${CI_DOCKERFILE}"
          IMAGE_REF="mskdsp:${{ steps.meta.outputs.image_version }}"
          IMAGE_TAR="images/${{ steps.meta.outputs.archive_name }}.tar"
          docker buildx build \
            --platform linux/arm64 \
            --load \
            -t "${IMAGE_REF}" \
            -f "${CI_DOCKERFILE}" \
            .
          rm -f "${IMAGE_TAR}"
          docker save -o "${IMAGE_TAR}" "${IMAGE_REF}"
          (
            cd script
            bash ./make_exe.sh "../${IMAGE_TAR}"
          )
          rm -f "${IMAGE_TAR}"

      - name: 生成校验文件
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=("images/${{ steps.meta.outputs.archive_name }}")
          if [ -f "${{ steps.meta.outputs.debug_archive_name }}.tar.gz" ]; then
            ASSETS+=("${{ steps.meta.outputs.debug_archive_name }}.tar.gz")
          fi
          sha256sum "${ASSETS[@]}" > SHA256SUMS

      - name: 生成静态更新清单
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          python3 script/workflow/write_lower_update_manifest.py \
            --channel beta \
            --platform linux-arm64 \
            --version "${{ steps.meta.outputs.image_version }}" \
            --artifact "images/${{ steps.meta.outputs.archive_name }}" \
            --checksums SHA256SUMS \
            --output latest.json \
            --base-url "${STATIC_UPDATE_BASE_URL}" \
            --repository "${{ github.repository }}" \
            --source-ref "${{ steps.ref.outputs.target_ref }}" \
            --source-sha "${SOURCE_SHA}"

      - name: 同步 beta 静态更新源
        shell: bash
        env:
          STATIC_UPDATE_SSH_KEY: ${{ secrets.LOWER_UPDATE_STATIC_SSH_KEY || secrets.UPDATE_STATIC_SSH_KEY }}
        run: |
          set -euo pipefail
          bash script/workflow/sync_static_lower_update.sh \
            --package-file "images/${{ steps.meta.outputs.archive_name }}" \
            --checksum-file SHA256SUMS \
            --manifest-file latest.json \
            --channel beta \
            --platform linux-arm64 \
            --base-url "${STATIC_UPDATE_BASE_URL}" \
            --ssh-host "${STATIC_UPDATE_SSH_HOST}" \
            --ssh-port "${STATIC_UPDATE_SSH_PORT}" \
            --ssh-user "${STATIC_UPDATE_SSH_USER}" \
            --remote-root "${STATIC_UPDATE_REMOTE_ROOT}"

      - name: 上传 Beta 包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.archive_name }}
          path: |
            images/${{ steps.meta.outputs.archive_name }}
            ${{ steps.meta.outputs.debug_archive_name }}.tar.gz
            SHA256SUMS
            latest.json
          if-no-files-found: ignore

      - name: 清理当前 Beta 线旧预发布
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BETA_TAG_PREFIX="${{ steps.meta.outputs.beta_tag_prefix }}"
          mapfile -t OLD_RELEASE_TAGS < <(gh release list --limit 100 --json tagName,isPrerelease --jq ".[] | select(.isPrerelease == true and (.tagName | startswith(\"${BETA_TAG_PREFIX}\"))) | .tagName")
          if [ "${#OLD_RELEASE_TAGS[@]}" -eq 0 ]; then
            echo "当前 Beta 线无旧预发布需要清理"
            exit 0
          fi
          printf '清理当前 Beta 线旧预发布:\n'
          printf '%s\n' "${OLD_RELEASE_TAGS[@]}"
          for tag in "${OLD_RELEASE_TAGS[@]}"; do
            gh release delete "${tag}" --cleanup-tag --yes
          done

      - name: 创建 Beta 预发布页面
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSETS=("images/${{ steps.meta.outputs.archive_name }}")
          if [ -f "${{ steps.meta.outputs.debug_archive_name }}.tar.gz" ]; then
            ASSETS+=("${{ steps.meta.outputs.debug_archive_name }}.tar.gz")
          fi
          ASSETS+=(SHA256SUMS latest.json)
          NOTES_START_TAG_OUTPUT="${{ steps.meta.outputs.notes_start_tag }}"
          RELEASE_ARGS=(
            "${{ steps.meta.outputs.beta_tag }}"
            "${ASSETS[@]}"
            --target "${{ steps.ref.outputs.target_ref }}"
            --title "${{ steps.meta.outputs.release_title }}"
            --prerelease
            --generate-notes
          )
          if [ -n "${NOTES_START_TAG_OUTPUT}" ]; then
            EXTRA_NOTES="$(cat <<EOF
          基线正式版本：${NOTES_START_TAG_OUTPUT}
          目标 Beta 分支：${{ steps.ref.outputs.target_ref }}
          说明范围：以下自动生成内容表示自上述正式版本以来的累计变更。
          EOF
            )"
            RELEASE_ARGS+=(--notes-start-tag "${NOTES_START_TAG_OUTPUT}")
          else
            EXTRA_NOTES="$(cat <<EOF
          基线正式版本：当前仓库暂无正式版本 tag（匹配 v*）
          目标 Beta 分支：${{ steps.ref.outputs.target_ref }}
          说明范围：当前为首个 Beta 预发布，以下自动生成内容由 GitHub 按默认规则生成。
          EOF
            )"
          fi
          RELEASE_ARGS+=(--notes "${EXTRA_NOTES}")
          gh release create "${RELEASE_ARGS[@]}"
