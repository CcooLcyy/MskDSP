workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG == null && ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main") && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
    - when: never

stages: [build-test, arm64-test, package, publish]

default:
  tags: [lower-ci]
  interruptible: true

variables:
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: none
  CMAKE_BUILD_PARALLEL_LEVEL: "8"
  VCPKG_MAX_CONCURRENCY: "8"

.build:
  stage: build-test
  tags: [lower-ci]
  environment:
    name: ci-build
    action: prepare
  timeout: 8h
  variables:
    LOWER_CACHE_ROOT: /ci-cache/mskdsp/gcc14-v1
    LOWER_CACHE_MOUNT: /ci-cache
  cache: []
  resource_group: mskdsp-lower-build-$CACHE_ARCH
  after_script:
    - CCACHE_DIR="$LOWER_CACHE_ROOT/ccache/$CACHE_ARCH" ccache --show-stats || true
  artifacts:
    name: lower-build-$ARCH-$CI_JOB_ID
    when: always
    expire_in: 7 days
    paths:
      - package/
      - release/$ARCH/
      - logs/$ARCH/
      - build-$ARCH/Testing/
.build-test:
  extends: .build
  script:
    - bash script/gitlab/build_lower.sh build "$ARCH"
  artifacts:
    reports:
      junit: logs/$ARCH/ctest.xml

build-arm64:
  extends: .build
  image:
    name: mskdsp-lower-cross-tools:ubuntu24.04-gcc14-v1
    docker:
      platform: linux/amd64
    pull_policy: if-not-present
  variables:
    ARCH: arm64
    CACHE_ARCH: arm64-cross
  script:
    - bash script/gitlab/build_lower.sh cross-build "${ARCH}"
    - echo 'ARM64 编译和安装完成，上传时仅排除中间对象文件，保留完整测试依赖及原始调试符号'
  artifacts:
    paths:
      - package/
      - release/arm64/
      - logs/arm64/
      - build-arm64/
    exclude:
      - build-arm64/**/*.o

build-test-x64:
  extends: .build-test
  image:
    name: mskdsp-ci-tools:ubuntu24.04-x64
    docker:
      platform: linux/amd64
    pull_policy: if-not-present
  variables:
    ARCH: x64
    CACHE_ARCH: x64

test-arm64:
  stage: arm64-test
  image:
    name: mskdsp-ci-tools:ubuntu24.04-arm64
    docker:
      platform: linux/arm64
    pull_policy: if-not-present
  variables:
    ARCH: arm64
  timeout: 2h
  needs:
    - job: build-arm64
      artifacts: true
  script:
    - bash script/gitlab/build_lower.sh test "${ARCH}"
    - echo 'ARM64 完整测试及独立符号包归档完成，上传时排除重复的原始调试符号目录'
  artifacts:
    name: lower-tested-arm64-$CI_JOB_ID
    when: always
    expire_in: 7 days
    paths:
      - package/
      - release/arm64/
      - logs/arm64/
      - build-arm64/Testing/
    exclude:
      - package/debug/**
    reports:
      junit: logs/arm64/ctest.xml

.package:
  stage: package
  image:
    name: mskdsp-lower-package-tools:bookworm-v1
    pull_policy: if-not-present
  environment:
    name: ci-build
    action: prepare
  timeout: 2h
  script:
    - bash script/gitlab/build_lower.sh package "$ARCH"
  artifacts:
    name: lower-release-$ARCH-$CI_JOB_ID
    when: always
    expire_in: 30 days
    paths:
      - release/$ARCH/
      - logs/$ARCH/

package-arm64:
  extends: .package
  variables:
    ARCH: arm64
  needs:
    - job: test-arm64
      artifacts: true

package-x64:
  extends: .package
  variables:
    ARCH: x64
  needs:
    - job: build-test-x64
      artifacts: true

.publish:
  stage: publish
  interruptible: false
  image:
    name: mskdsp-platform-ci-tools:bookworm-v2
    pull_policy: if-not-present
  timeout: 2h
  script:
    - python3 script/gitlab/init_platform_proto.py
    - python3 script/gitlab/platform_client.py --metadata "release/$ARCH/metadata.json" --proto-root .ci/platform-proto

publish-arm64:
  extends: .publish
  variables:
    ARCH: arm64
  environment:
    name: ci
  resource_group: mskdsp-lower-ci-arm64
  needs:
    - job: package-arm64
      artifacts: true
    - job: package-x64
      artifacts: false

publish-x64:
  extends: .publish
  variables:
    ARCH: x64
  environment:
    name: ci
  resource_group: mskdsp-lower-ci-x64
  needs:
    - job: package-arm64
      artifacts: false
    - job: package-x64
      artifacts: true
