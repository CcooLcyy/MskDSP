workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG == null && ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main") && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
    - when: never

stages: [build, test, package, publish]

default:
  tags: [lower-ci]
  interruptible: true

variables:
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: none
  GIT_STRATEGY: clone
  GIT_CLONE_PATH: /builds/lower/$CI_PROJECT_PATH
  FF_ENABLE_JOB_CLEANUP: "true"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  VCPKG_MAX_CONCURRENCY: "4"

.build:
  stage: build
  tags: [lower-ci]
  environment:
    name: ci-build
    action: prepare
  timeout: 8h
  variables:
    LOWER_CACHE_ROOT: /ci-cache/mskdsp/gcc14-v1
    LOWER_CACHE_MOUNT: /ci-cache
  cache: []
  resource_group: mskdsp-lower-build-$CACHE_ARCH
  after_script:
    - CCACHE_DIR="$LOWER_CACHE_ROOT/ccache/$CACHE_ARCH" ccache --show-stats || true
  artifacts:
    name: lower-build-$ARCH-$CI_JOB_ID
    when: always
    expire_in: 7 days
    paths:
      - package/
      - release/$ARCH/
      - logs/$ARCH/

build-arm64:
  extends: .build
  image:
    name: mskdsp-lower-cross-tools:ubuntu24.04-gcc14-v1
    docker:
      platform: linux/amd64
    pull_policy: if-not-present
  variables:
    ARCH: arm64
    CACHE_ARCH: arm64-cross
  script:
    - bash script/gitlab/build_lower.sh cross-build "${ARCH}"
    - echo 'ARM64 交叉编译、安装及独立符号包归档完成，不执行 ARM64 测试，上传运行产物与符号包'
  artifacts:
    paths:
      - package/
      - release/arm64/
      - logs/arm64/
    exclude:
      - package/debug/**

build-x64:
  extends: .build
  image:
    name: mskdsp-ci-tools:ubuntu24.04-x64
    docker:
      platform: linux/amd64
    pull_policy: if-not-present
  variables:
    ARCH: x64
    CACHE_ARCH: x64
  script:
    - bash script/gitlab/build_lower.sh build "$ARCH"
  artifacts:
    paths:
      - package/
      - release/x64/
      - logs/x64/
      - build-x64/
    exclude:
      - build-x64/**/*.o

test-x64:
  stage: test
  image:
    name: mskdsp-ci-tools:ubuntu24.04-x64
    docker:
      platform: linux/amd64
    pull_policy: if-not-present
  variables:
    ARCH: x64
  timeout: 2h
  needs:
    - job: build-x64
      artifacts: true
  script:
    - bash script/gitlab/build_lower.sh test "${ARCH}"
  artifacts:
    name: lower-tested-x64-$CI_JOB_ID
    when: always
    expire_in: 7 days
    paths:
      - package/
      - release/x64/
      - logs/x64/
      - build-x64/Testing/
    reports:
      junit: logs/x64/ctest.xml

.package:
  stage: package
  image:
    name: mskdsp-lower-package-tools:bookworm-v1
    pull_policy: if-not-present
  environment:
    name: ci-build
    action: prepare
  timeout: 2h
  script:
    - bash script/gitlab/build_lower.sh package "$ARCH"
  artifacts:
    name: lower-release-$ARCH-$CI_JOB_ID
    when: always
    expire_in: 30 days
    paths:
      - release/$ARCH/
      - logs/$ARCH/

package-arm64:
  extends: .package
  variables:
    ARCH: arm64
  needs:
    - job: build-arm64
      artifacts: true
    - job: test-x64
      artifacts: false

package-x64:
  extends: .package
  variables:
    ARCH: x64
  needs:
    - job: test-x64
      artifacts: true

.publish:
  stage: publish
  interruptible: false
  image:
    name: mskdsp-platform-ci-tools:bookworm-v2
    pull_policy: if-not-present
  timeout: 2h
  script:
    - python3 script/gitlab/init_platform_proto.py
    - python3 script/gitlab/platform_client.py --metadata "release/$ARCH/metadata.json" --proto-root .ci/platform-proto

publish-arm64:
  extends: .publish
  variables:
    ARCH: arm64
  environment:
    name: ci
  resource_group: mskdsp-lower-ci-arm64
  needs:
    - job: package-arm64
      artifacts: true
    - job: package-x64
      artifacts: false

publish-x64:
  extends: .publish
  variables:
    ARCH: x64
  environment:
    name: ci
  resource_group: mskdsp-lower-ci-x64
  needs:
    - job: package-arm64
      artifacts: false
    - job: package-x64
      artifacts: true
