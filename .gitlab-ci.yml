# 下位机 GitLab 流水线：保持 GitHub CI、Beta、Stable 的触发与交付产物。
# 初次验证默认不发布；完成验证并切换唯一发布端后，再启用项目变量。
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v/'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "web" && $MSKDSP_PIPELINE_MODE == "stable"'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(master|main|beta\/.+)$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages: [build, package, publish]

variables:
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: none
  MSKDSP_PIPELINE_MODE:
    value: ci
    options: [ci, beta, stable]
    description: "手动流水线的渠道；自动流水线按分支或 tag 判断。"
  BETA_REF:
    value: ""
    description: "手动 Beta 的目标分支；为空时使用当前分支，必须以 beta/ 开头。"
  RELEASE_TAG:
    value: ""
    description: "手动正式发布的目标 tag，例如 v0.4.0。"
  MSKDSP_PUBLISH_ENABLED:
    value: "false"
    description: "验证期间不写 R2 或 Release；切换唯一发布端后设为 true。"
  R2_BUCKET: mskdsp-update
  R2_PUBLIC_BASE_URL: https://update.clsclear.top

default:
  interruptible: true

.ci-build-rules:
  rules: &ci_build_rules
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        MAKE_PACKAGE: "false"
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(master|main)$/'
      variables:
        MAKE_PACKAGE: "true"
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^beta\/.+/'
      variables:
        MAKE_PACKAGE: "false"
    - if: '$CI_PIPELINE_SOURCE == "web" && $MSKDSP_PIPELINE_MODE == "ci"'
      variables:
        MAKE_PACKAGE: "false"
    - when: never

.ci-package-rules:
  rules: &ci_package_rules
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(master|main)$/'
    - when: never

.beta-rules:
  rules: &beta_rules
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^beta\/.+/'
    - if: '$CI_PIPELINE_SOURCE == "web" && $MSKDSP_PIPELINE_MODE == "beta"'
    - when: never

.stable-rules:
  rules: &stable_rules
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_PIPELINE_SOURCE == "web" && $MSKDSP_PIPELINE_MODE == "stable"'
    - when: never

.x64:
  image:
    name: mskdsp-ci-tools:ubuntu24.04-x64
    entrypoint: [""]
    docker:
      platform: linux/amd64
  tags: [linux, amd64, docker, ci]
  variables:
    ARCH_SLUG: x64
    BUILD_PARALLEL: "4"

.arm64:
  image:
    name: mskdsp-ci-tools:ubuntu24.04-arm64
    entrypoint: [""]
    docker:
      platform: linux/arm64
  tags: [linux, arm64-qemu, docker, ci]
  variables:
    ARCH_SLUG: arm64
    BUILD_PARALLEL: "2"

.lower-build:
  stage: build
  timeout: 24h
  # vcpkg 自身按 ABI 校验缓存；不同架构、Beta 版本线不共写缓存目录。
  cache:
    - key:
        prefix: vcpkg-gcc14-${ARCH_SLUG}-${VCPKG_CACHE_CHANNEL}-${VCPKG_CACHE_REF}
        files: [vcpkg.json, vcpkg-configuration.json]
      paths: [".cache/vcpkg/${ARCH_SLUG}/", .cache/vcpkg-downloads/]
      policy: $VCPKG_CACHE_POLICY
    - key: ccache-gcc14-${ARCH_SLUG}-v2
      paths: [".cache/ccache/${ARCH_SLUG}/"]
  variables:
    VCPKG_CACHE_POLICY: pull-push
    VCPKG_CACHE_CHANNEL: $CHANNEL
    VCPKG_CACHE_REF: $CI_COMMIT_REF_SLUG
  script:
    - bash script/workflow/gitlab_lower_build.sh
  after_script:
    - 'CCACHE_DIR="$CI_PROJECT_DIR/.cache/ccache/$ARCH_SLUG" ccache --show-stats || true'
  artifacts:
    when: always
    expire_in: 7 days
    paths: [package/, build.env, "build-${ARCH_SLUG}/Testing/Temporary/LastTest.log", "build-${ARCH_SLUG}/ctest-junit.xml"]
    reports:
      dotenv: build.env
      junit: build-${ARCH_SLUG}/ctest-junit.xml

.lower-package:
  stage: package
  timeout: 2h
  image:
    name: mskdsp-ci-tools:ubuntu24.04-x64
    entrypoint: [""]
  # Docker 权限仅交给本项目专用的打包 Runner，编译 Runner 保持非特权。
  tags: [linux, amd64, docker-package, mskdsp]
  script:
    - bash script/workflow/gitlab_lower_package.sh
  artifacts:
    expire_in: 7 days
    paths: [images/, build.env, SHA256SUMS, latest.json, mskdsp-*-debugsymbols-*.tar.gz]
    reports:
      dotenv: build.env

.lower-publish:
  stage: publish
  timeout: 1h
  image:
    name: mskdsp-ci-tools:ubuntu24.04-x64
    entrypoint: [""]
  tags: [linux, amd64, docker, ci]
  # 写更新清单与清理旧资产必须串行，不能在上传过程中自动取消。
  interruptible: false
  resource_group: lower-publish-${CHANNEL}-${ARCH_SLUG}
  before_script:
    - |
      if [ "${MSKDSP_PUBLISH_ENABLED}" = "true" ] && ! command -v aws >/dev/null 2>&1; then
        echo "安装发布需要的 AWS CLI"
        aws_tmp="$(mktemp -d)"
        curl -fsSL --retry 3 https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o "${aws_tmp}/aws.zip"
        unzip -q "${aws_tmp}/aws.zip" -d "${aws_tmp}"
        "${aws_tmp}/aws/install" --update
        rm -rf "${aws_tmp}"
      fi
  script:
    - python3 script/workflow/gitlab_lower_publish.py

ci-x64-build:
  extends: [.lower-build, .x64]
  variables:
    CHANNEL: ci
  rules: *ci_build_rules

ci-arm64-build:
  extends: [.lower-build, .arm64]
  variables:
    CHANNEL: ci
  rules: *ci_build_rules

ci-x64-package:
  extends: .lower-package
  needs: [{job: ci-x64-build, artifacts: true}]
  variables:
    CHANNEL: ci
    ARCH_SLUG: x64
  rules: *ci_package_rules

ci-arm64-package:
  extends: .lower-package
  needs: [{job: ci-arm64-build, artifacts: true}]
  variables:
    CHANNEL: ci
    ARCH_SLUG: arm64
  rules: *ci_package_rules

ci-x64-publish:
  extends: .lower-publish
  needs: [{job: ci-x64-package, artifacts: true}]
  variables:
    CHANNEL: ci
    ARCH_SLUG: x64
  rules: *ci_package_rules

ci-arm64-publish:
  extends: .lower-publish
  needs: [{job: ci-arm64-package, artifacts: true}]
  variables:
    CHANNEL: ci
    ARCH_SLUG: arm64
  rules: *ci_package_rules

beta-arm64-build:
  extends: [.lower-build, .arm64]
  variables:
    CHANNEL: beta
    MAKE_PACKAGE: "true"
  rules: *beta_rules

beta-arm64-package:
  extends: .lower-package
  needs: [{job: beta-arm64-build, artifacts: true}]
  variables:
    CHANNEL: beta
    ARCH_SLUG: arm64
  rules: *beta_rules

beta-arm64-publish:
  extends: .lower-publish
  needs: [{job: beta-arm64-package, artifacts: true}]
  variables:
    CHANNEL: beta
    ARCH_SLUG: arm64
  rules: *beta_rules

stable-arm64-build:
  extends: [.lower-build, .arm64]
  interruptible: false
  variables:
    CHANNEL: stable
    MAKE_PACKAGE: "true"
    VCPKG_CACHE_POLICY: pull
    VCPKG_CACHE_CHANNEL: ci
    VCPKG_CACHE_REF: master
  rules: *stable_rules

stable-arm64-package:
  extends: .lower-package
  interruptible: false
  needs: [{job: stable-arm64-build, artifacts: true}]
  variables:
    CHANNEL: stable
    ARCH_SLUG: arm64
  rules: *stable_rules

stable-arm64-publish:
  extends: .lower-publish
  needs: [{job: stable-arm64-package, artifacts: true}]
  variables:
    CHANNEL: stable
    ARCH_SLUG: arm64
  rules: *stable_rules
